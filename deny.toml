# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# `just deny` / CI run `cargo deny check` (advisories, licenses, bans, sources).

[graph]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # "RUSTSEC-0000-0000", # reason + link to tracking issue
  # `paste` is unmaintained (no vulnerability). It reaches us only through
  # tokenizers -> fastembed (kevin-memory's local embeddings, ADR 0004), is a
  # compile-time-only proc macro, and has no safe upgrade yet. Revisit when
  # tokenizers moves to `pastey`: https://github.com/huggingface/tokenizers
  "RUSTSEC-2024-0436",
]

[licenses]
# Permissive licenses only; add new entries deliberately (with a PR comment).
allow = [
  "MIT",
  "MIT-0", # borrow-or-share (via jsonschema → referencing → fluent-uri), WS-05
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
  # The store is sqlx/Postgres only; keep other DB drivers out of the graph.
  { crate = "diesel", reason = "kevin-store uses sqlx (plan/01)" },
  { crate = "rusqlite", reason = "Postgres is the only store (plan/01)" },
  # Workers are CLIs; no direct provider SDKs in v1 (plan/00).
  { crate = "async-openai", reason = "no provider HTTP clients in v1 (plan/00)" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
